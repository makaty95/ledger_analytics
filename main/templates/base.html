<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DB helper</title>
    <style>

        /* ---------------------------------------------------------
           TOKENS
        --------------------------------------------------------- */
        :root{
          --paper:      #F6F4EF;
          --panel:      #FFFFFF;
          --ink:        #23262B;
          --ink-soft:   #5B6470;
          --line:       #DAD5C8;
          --line-soft:  #E8E4D9;
          --navy:       #2F4858;
          --navy-dark:  #1E313C;
          --stripe:     #FAF8F3;
          --user-bg:    #EFEDE6;
          --ok:         #3E6B4F;

          --serif:  Georgia, "Iowan Old Style", "Times New Roman", serif;
          --sans:   "Helvetica Neue", Helvetica, Arial, sans-serif;
          --mono:   "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        * { box-sizing: border-box; }
        html, body {
          height: 100%;
          margin: 0;
          background: var(--paper);
          color: var(--ink);
          font-family: var(--sans);
        }

        /* ---------------------------------------------------------
           FRAME
        --------------------------------------------------------- */
        .frame {
          height: 100vh;
          display: flex;
          flex-direction: column;
        }

        .topbar {
          flex: 0 0 auto;
          display: flex;
          align-items: baseline;
          gap: 14px;
          padding: 16px 26px;
          background: var(--navy-dark);
          color: #EFE9DC;
          border-bottom: 1px solid #142028;
        }
        .topbar .mark {
          font-family: var(--serif);
          font-size: 21px;
          letter-spacing: 0.3px;
        }
        .topbar .mark em{ font-style: italic; color: #B9C6CC; font-weight: 400; }
        .topbar .path {
          font-family: var(--mono);
          font-size: 12.5px;
          color: #8FA0A8;
        }
        .topbar .status{
          margin-left: auto;
          font-size: 12px;
          font-family: var(--mono);
          color: #9FD6B2;
          display: flex;
          align-items: center;
          gap: 7px;
        }
        .topbar .status .dot{
          width: 7px; height: 7px; border-radius: 50%;
          background: #6FCF8E;
          box-shadow: 0 0 0 3px rgba(111,207,142,0.15);
        }

        .body {
          flex: 1 1 auto;
          display: flex;
          min-height: 0;
        }

        /* ---------------------------------------------------------
           LEFT — CHAT
        --------------------------------------------------------- */
        .chat {
          flex: 0 0 380px;
          max-width: 380px;
          display: flex;
          flex-direction: column;
          background: var(--panel);
          border-right: 1px solid var(--line);
          min-height: 0;
        }

        .chat-head {
          padding: 18px 20px 14px;
          border-bottom: 1px solid var(--line-soft);
        }
        .chat-head h1{
          margin: 0 0 3px;
          font-family: var(--serif);
          font-size: 17px;
          font-weight: 700;
        }
        .chat-head p{
          margin: 0;
          font-size: 12.5px;
          color: var(--ink-soft);
        }

        .thread {
          flex: 1 1 auto;
          overflow-y: auto;
          padding: 18px 20px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .msg { max-width: 100%; }
        .msg .who {
          font-family: var(--mono);
          font-size: 10.5px;
          text-transform: uppercase;
          letter-spacing: 0.6px;
          color: var(--ink-soft);
          margin-bottom: 5px;
        }
        .msg .bubble {
          font-size: 13.8px;
          line-height: 1.5;
          padding: 10px 13px;
          border: 1px solid var(--line);
        }

        .msg.user .bubble {
          background: var(--user-bg);
          border-color: var(--line);
        }
        .msg.ai .bubble {
          background: var(--panel);
          border-color: var(--line-soft);
          border-left: 3px solid var(--navy);
        }
        .msg.ai .bubble p{ margin: 0 0 8px; }
        .msg.ai .bubble p:last-child{ margin-bottom: 0; }

        .msg.ai .query-chip{
          margin-top: 8px;
          font-family: var(--mono);
          font-size: 11.5px;
          color: var(--navy);
          background: var(--stripe);
          border: 1px solid var(--line-soft);
          padding: 7px 9px;
          white-space: pre-wrap;
          word-break: break-word;
        }

        .thread::-webkit-scrollbar{ width: 9px; }
        .thread::-webkit-scrollbar-thumb{ background: var(--line); }
        .thread::-webkit-scrollbar-track{ background: transparent; }

        .composer {
          flex: 0 0 auto;
          border-top: 1px solid var(--line);
          padding: 14px 16px 16px;
          background: var(--panel);
        }
        .composer form{
          display: flex;
          gap: 8px;
          align-items: flex-end;
        }
        .composer textarea{
          flex: 1 1 auto;
          resize: none;
          height: 44px;
          padding: 10px 11px;
          font-family: var(--sans);
          font-size: 13.5px;
          color: var(--ink);
          background: var(--paper);
          border: 1px solid var(--line);
          outline: none;
        }
        .composer textarea:focus{
          border-color: var(--navy);
        }
        .composer button{
          height: 44px;
          padding: 0 18px;
          background: var(--navy);
          color: #F4F1E9;
          border: 1px solid var(--navy);
          font-family: var(--sans);
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
        }
        .composer button:hover{ background: var(--navy-dark); }
        .composer .hint{
          margin: 8px 2px 0;
          font-size: 11px;
          color: var(--ink-soft);
        }

        /* ---------------------------------------------------------
           RIGHT — RESULTS
        --------------------------------------------------------- */
        .results {
          flex: 1 1 auto;
          display: flex;
          flex-direction: column;
          min-width: 0;
          min-height: 0;
        }

        .results-head {
          flex: 0 0 auto;
          padding: 16px 26px 0;
          border-bottom: 1px solid var(--line);
          background: var(--panel);
        }
        .results-head .title-row{
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 20px;
        }
        .results-head h2{
          margin: 0 0 4px;
          font-family: var(--serif);
          font-size: 19px;
        }
        .results-head .meta{
          font-size: 12px;
          color: var(--ink-soft);
          font-family: var(--mono);
        }

        .tabs{
          display: flex;
          gap: 22px;
          margin-top: 14px;
        }
        .tabs a{
          display: inline-block;
          padding: 8px 2px 10px;
          font-size: 12.5px;
          font-family: var(--mono);
          text-transform: uppercase;
          letter-spacing: 0.5px;
          color: var(--ink-soft);
          text-decoration: none;
          border-bottom: 2px solid transparent;
        }
        .tabs a.active{
          color: var(--navy);
          border-bottom-color: var(--navy);
        }

        .sql-strip{
          margin: 14px 0 0;
          padding: 10px 14px;
          background: var(--navy-dark);
          color: #D7E4E9;
          font-family: var(--mono);
          font-size: 12.5px;
          overflow-x: auto;
          white-space: pre;
        }
        .sql-strip .kw{ color: #9FD6B2; }
        .sql-strip .lit{ color: #E7C88E; }

        .results-body{
          flex: 1 1 auto;
          overflow: auto;
          padding: 18px 26px 30px;
          background: var(--paper);
        }

        .summary-row{
          display: flex;
          gap: 14px;
          margin-bottom: 18px;
          flex-wrap: wrap;
        }
        .stat{
          background: var(--panel);
          border: 1px solid var(--line);
          padding: 12px 16px;
          min-width: 140px;
        }
        .stat .num{
          font-family: var(--serif);
          font-size: 22px;
          color: var(--navy);
        }
        .stat .label{
          font-size: 11px;
          color: var(--ink-soft);
          font-family: var(--mono);
          text-transform: uppercase;
          letter-spacing: 0.4px;
          margin-top: 2px;
        }

        table.report{
          width: 100%;
          border-collapse: collapse;
          background: var(--panel);
          border: 1px solid var(--line);
          font-size: 13px;
        }
        table.report caption{
          text-align: left;
          font-family: var(--serif);
          font-size: 14px;
          padding: 4px 0 10px;
          color: var(--ink);
        }
        table.report thead th{
          text-align: left;
          font-family: var(--mono);
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.4px;
          color: var(--ink-soft);
          background: var(--stripe);
          padding: 10px 14px;
          border-bottom: 1px solid var(--line);
          border-right: 1px solid var(--line-soft);
          white-space: nowrap;
        }
        table.report thead th:last-child{ border-right: none; }
        table.report tbody td{
          padding: 9px 14px;
          border-bottom: 1px solid var(--line-soft);
          border-right: 1px solid var(--line-soft);
          color: var(--ink);
          font-variant-numeric: tabular-nums;
        }
        table.report tbody td:last-child{ border-right: none; }
        table.report tbody tr:nth-child(even){ background: var(--stripe); }
        table.report tbody tr:hover{ background: #F0EEE4; }
        table.report td.num{ text-align: right; font-family: var(--mono); }
        table.report td.tag{
          font-family: var(--mono);
          font-size: 11.5px;
          color: var(--ok);
        }

        .results-foot{

          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 14px;
          font-size: 11.5px;
          color: var(--ink-soft);
          font-family: var(--mono);
        }
        .results-foot .export{
          color: var(--navy);
          text-decoration: none;
          border-bottom: 1px solid var(--navy);
          padding-bottom: 1px;
        }

        .result-paragraph {
          font-family: var(--serif);
        }

        .chart-block {
            position: relative;
            height: 320px;
        }

        .disconnect {
            margin-left: auto;
            background: transparent;
            border: 1px solid #8FA0A8;
            color: #EFE9DC;
            font-family: var(--sans);
            font-size: 12px;
            padding: 5px 12px;
            cursor: pointer;
        }
        .disconnect:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ---------------------------------------------------------
           RESPONSIVE
        --------------------------------------------------------- */
        @media (max-width: 860px){
          .body{ flex-direction: column; }
          .chat{ max-width: none; flex: 0 0 42%; border-right: none; border-bottom: 1px solid var(--line); }
          .results-body{ padding: 16px; }
        }

    </style>
</head>
<body>

<div class="frame">
    {% include "partials/ui/_navbar.html" %}
    <div class="body">

        <!-- ============ LEFT: CHAT ============ -->
        {% block chat %}{% endblock chat %}

        <!-- ============ RIGHT: RESULTS ============ -->
        {% block content %}
        <p>Queries results are displayed here.</p>
        {% endblock content %}

    </div>
</div>

    {% block scripts %}{% endblock scripts %}
</body>
</html>
